# not actually YAML but lets pretend:
# -*- mode: yaml -*-
# vim: ft=yaml:

# append some arguments to the commandline;
# accepts anything listed in --help (leading dashes are optional)
# and inline comments are OK if there is 2 spaces before the '#'
[global]
  p: 8086, 3939  # listen on ports 8086 and 3939
  e2dsa  # enable file indexing and filesystem scanning
  e2ts   # and enable multimedia indexing
  z, qr  # and zeroconf and qrcode (you can comma-separate arguments)

# create users:
[accounts]
  flambe: passhack   # username: password

# create volumes:
[/]                        # create a volume at "/" (the webroot), which will
  /usr/local/partyplace    # share the contents of "." (the current directory)
  accs:
    rwdm: flambe   # the user "flambe" gets read/write/move/delete
  flags:
    # Alpine's live/diskless root is a RAM-backed overlay, so copyparty's
    # ramdisk guard strips w+m from the volume and leaves only r+d. wram keeps
    # uploads enabled (note: on a diskless boot the files live in RAM and are
    # lost on reboot unless /usr/local/partyplace sits on persistent storage).
    wram
